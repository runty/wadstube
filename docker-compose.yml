services:
  tube:
    build: .
    # Set TUBE_UID_GID=1000:1000 only after chowning ./data to that UID/GID.
    user: "${TUBE_UID_GID:-0:0}"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - DATA_DIR=/app/data
      - PORT=3000
      - MAX_VIDEOS=${MAX_VIDEOS:-50}
      - REFRESH_MODE=${REFRESH_MODE:-rss}
      - REFRESH_MODE_MANUAL=${REFRESH_MODE_MANUAL:-}
      - SMART_REFRESH_POLICY_JSON=${SMART_REFRESH_POLICY_JSON:-}
      - YOUTUBE_QUOTA_GENERAL_LIMIT=${YOUTUBE_QUOTA_GENERAL_LIMIT:-10000}
      - YOUTUBE_QUOTA_SEARCH_LIMIT=${YOUTUBE_QUOTA_SEARCH_LIMIT:-100}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - TZ=${TZ:-America/Los_Angeles}
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 512m
